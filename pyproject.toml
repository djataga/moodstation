[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moodstation"
version = "0.1.0"
description = "Playlists dynamiques par ambiance pour Synology DS Audio, avec IA locale sur Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MoodStation contributors" }]
keywords = ["synology", "ds-audio", "audio-station", "playlist", "llm", "raspberry-pi"]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "mutagen>=1.46",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
moodstation = "moodstation.cli:main"

[tool.setuptools.packages.find]
include = ["moodstation*"]
